<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bruno & Márcia</title>
<style>
  :root {
    /* Layout: página vertical única, centralizada, com seções separadas por filetes. */
    --bg: #ffffff;
    --fg: #1c3142;
    --accent: #2d6f94;
    --rule: #cbdde8;
    --font-display: Georgia, "Times New Roman", serif;
    --font-body: Georgia, "Times New Roman", serif;
    color-scheme: light;
  }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font-body);
    line-height: 1.6;
    font-size: 16px;
    padding-inline: 16px;
    padding-block: 0;
  }
  * { box-sizing: border-box; }
  html { overflow-y: scroll; scrollbar-width: thin; scrollbar-color: var(--accent) var(--rule); }
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-track { background: var(--rule); }
  ::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 4px; }
  h1, h2 { font-family: var(--font-display); font-weight: normal; text-wrap: balance; }
  .hero { text-align: center; padding: 3rem 0 2rem; border-bottom: 1px solid var(--rule); }
  .hero h1 { font-size: clamp(2rem, 8vw, 3.5rem); color: var(--accent); margin: 0; }
  .data { margin: .5rem 0 0; letter-spacing: .1em; text-transform: uppercase; font-size: .9rem; }
  main { max-width: 640px; margin: 0 auto; }
  .secao { padding: 2.5rem 0; border-bottom: 1px solid var(--rule); text-align: center; }
  .secao:last-child { border-bottom: none; }
  .secao h2 { font-size: 1.6rem; color: var(--accent); margin: 0 0 1rem; }
  .endereco { margin: 1.5rem 0 1.25rem; }
  .endereco p { margin: 0; }
  .botoes-mapa { display: flex; flex-direction: row; flex-wrap: wrap; gap: .75rem; justify-content: center; }
  .botao {
    display: inline-block; padding: .7rem 1.4rem; min-height: 44px; min-width: 44px;
    border: 1px solid var(--accent); border-radius: 4px; color: var(--accent);
    background: transparent; font: inherit; text-decoration: none; cursor: pointer;
  }
  .botao:hover, .botao:focus-visible, .botao[aria-pressed="true"] { background: var(--accent); color: var(--bg); }
  .form-busca { display: flex; flex-direction: column; gap: .75rem; align-items: center; }
  .form-busca label { font-size: .95rem; }
  .form-busca input {
    width: 100%; max-width: 320px; min-height: 44px; padding: .7rem; font: inherit;
    border: 1px solid var(--rule); border-radius: 4px; background: var(--bg); color: var(--fg);
  }
  .resultados { list-style: none; margin: 1.25rem 0 0; padding: 0; display: flex; flex-direction: column; gap: .5rem; align-items: center; }
  .resultados li { display: flex; flex-wrap: wrap; gap: .75rem; align-items: center; justify-content: center; }
  .resultados .botao { padding: .4rem 1rem; min-height: 40px; }
  .faq { text-align: left; }
  .faq details { border-bottom: 1px solid var(--rule); }
  .faq details:first-of-type { border-top: 1px solid var(--rule); }
  .faq summary { cursor: pointer; min-height: 44px; display: flex; align-items: center; }
  .faq p { margin: 0 0 .75rem; }
  .logo-restaurante { display: block; width: 180px; max-width: 100%; margin: 1.5rem auto 0; }
  .logo-restaurante img { display: block; width: 100%; height: auto; }
  .familia { list-style: none; margin: 0 0 1rem; padding: 0; display: flex; flex-direction: column; gap: .5rem; align-items: center; }
  .familia li { display: flex; flex-wrap: wrap; gap: .75rem; align-items: center; justify-content: center; }
  .familia .botao { padding: .4rem 1rem; min-height: 40px; }
  .mensagem { margin: 1rem 0 0; min-height: 1.5rem; font-style: italic; }
  .player { width: 100%; max-width: 480px; margin-top: 1rem; }
  .faixas { list-style: none; margin: 1rem 0 0; padding: 0; display: flex; flex-direction: column; gap: .5rem; align-items: center; }
  footer { text-align: center; padding: 2rem 0; border-top: 1px solid var(--rule); font-size: .9rem; }
  footer p { margin: 0; }
  .botao-app {
    display: flex; flex-direction: column; align-items: center; gap: .35rem;
    min-width: 120px; min-height: 44px; padding: .8rem 1rem;
    border: 1px solid var(--rule); border-radius: 8px; color: var(--fg);
    text-decoration: none; font-size: .9rem;
  }
  .botao-app:hover, .botao-app:focus-visible { border-color: var(--accent); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  @media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }
  .foto-capa { display: block; width: 100%; max-width: 480px; height: auto; margin: 0 auto; border-radius: 4px; }
  .verso { max-width: 420px; margin: 1.5rem auto 0; font-style: italic; line-height: 1.7; color: var(--accent); }
  .verso-autor { max-width: 420px; margin: .5rem auto 0; font-size: .85rem; letter-spacing: .05em; }
</style>

    { pergunta: "Qual o código de vestimenta?", resposta: "Queremos que vocês estejam confortáveis para aproveitar esse dia conosco! Camisas, calças de sarja, jeans ou alfaiataria, vestidos, saias e macacões são ótimas opções. Não é necessário usar gravata ou traje formal." },

    nome: "Restaurante Panorama",
    predio: "Prédio 41",
    andar: "4º andar",
    endereco: "PUCRS, Av. Ipiranga, 6681 - Porto Alegre - RS",
    consulta: "Restaurante+Panorama+PUCRS+Porto+Alegre",
    site: "https://panoramagastronomico.com/",
  };

  // Ex.: { titulo: "Música 1", arquivo: "https://..." }
  const PLAYLIST = [];

  // ===== Lógica =====
  const CHAVE = "confirmacoes-casamento";

  const normalizar = (t) =>
    t.normalize("NFD").replace(/[̀-ͯ]/g, "").trim().toLowerCase();

  // Membro pode ser texto ou { nome, busca: false } (não aparece na busca, mas aparece na família).
  const nomeDe = (m) => (typeof m === "string" ? m : m.nome);
  const buscavel = (m) => typeof m === "string" || m.busca !== false;

  const lerConfirmados = () => {
    try { return JSON.parse(localStorage.getItem(CHAVE)) || {}; }
    catch { return {}; }
  };

  function App() {
    const [termo, setTermo] = useState("");
    const [buscado, setBuscado] = useState("");
    const [confirmados, setConfirmados] = useState(lerConfirmados);
    const [erro, setErro] = useState("");
    const [faixa, setFaixa] = useState(PLAYLIST[0]?.arquivo ?? "");

    useEffect(() => {
      try { localStorage.setItem(CHAVE, JSON.stringify(confirmados)); }
      catch { setErro("Não foi possível salvar. Tente novamente."); }
    }, [confirmados]);

    const termoNormalizado = normalizar(buscado);
    const familiasEncontradas = buscado
      ? FAMILIAS
          .map((membros, id) => ({ id, membros }))
          .filter((f) => f.membros.some((m) => buscavel(m) && normalizar(nomeDe(m)).split(/\s+/)[0] === termoNormalizado))
      : [];

    const buscar = (e) => { e.preventDefault(); setBuscado(termo.trim()); };

    const URL_PLANILHA = "https://script.google.com/macros/s/AKfycbxJUtLvzgcAhhG7XpvraoBnuQjCf_RSfWUji6lFzQD81aQ8B5nB8l-4zfouQLsAbIhIvQ/exec";

    const alternar = (chave, nome, familia) => {
      const confirmado = !confirmados[chave];
      setConfirmados((prev) => {
        const novo = { ...prev };
        if (novo[chave]) delete novo[chave]; else novo[chave] = true;
        return novo;
      });
      fetch(URL_PLANILHA, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "text/plain" },
        body: JSON.stringify({ chave, nome, familia, confirmado }),
      }).catch(() => {});
    };

    const mapsUrl = `https://www.google.com/maps/search/?api=1&query=${LOCAL.consulta}`;
    const wazeUrl = `https://waze.com/ul?q=${LOCAL.consulta}`;

      ? "Nome não encontrado. Verifique a grafia ou fale com os noivos." : "");

            </a>
            <div className="endereco">
              <p>{LOCAL.predio}, {LOCAL.andar}</p>
              <p>{LOCAL.endereco}</p>
            </div>
            <div className="botoes-mapa">
              <a className="botao-app" href={mapsUrl} target="_blank" rel="noopener noreferrer" aria-label="Abrir no Google Maps">
                <svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true">
                  <path fill="#EA4335" d="M12 2a7 7 0 0 0-7 7c0 5 7 13 7 13s7-8 7-13a7 7 0 0 0-7-7zm0 9.5a2.5 2.5 0 1 1 0-5 2.5 2.5 0 0 1 0 5z"/>
                </svg>
                <span>Google Maps</span>
              </a>
              <a className="botao-app" href={wazeUrl} target="_blank" rel="noopener noreferrer" aria-label="Abrir no Waze">
                <svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true">
                  <path fill="#33CCFF" d="M12 2C6.5 2 2.5 6 2.5 11c0 2.2.8 4.2 2.1 5.7L3.5 21l4.5-1.1c1.4.6 2.9.9 4 .9 5.5 0 9.5-4 9.5-9S17.5 2 12 2z"/>
                  <circle cx="9" cy="10" r="1.2" fill="#fff"/>
                  <circle cx="15" cy="10" r="1.2" fill="#fff"/>
                  <path d="M8.5 14.2c1 1.2 2.2 1.8 3.5 1.8s2.5-.6 3.5-1.8" stroke="#fff" stroke-width="1.2" fill="none" stroke-linecap="round"/>
                </svg>
                <span>Waze</span>
              </a>
            </div>
          </section>

          <section id="playlist" className="secao">
            <h2>Playlist</h2>
            <p>Uma seleção de músicas para sua viagem até a nossa celebração.</p>
            <div className="botoes-mapa">
              <a className="botao" href="https://open.spotify.com/playlist/1gHD0BCC6FfAkqymJ7jHeq" target="_blank" rel="noopener noreferrer">Ouvir no Spotify</a>
            </div>
            {PLAYLIST.length > 0 && (
              <>
                <audio controls preload="none" src={faixa} className="player" />
                <ul className="faixas">
                  {PLAYLIST.map((f) => (
                    <li key={f.arquivo}>
                      <button type="button" className="botao" onClick={() => setFaixa(f.arquivo)}>
                        {f.titulo}
                      </button>
                    </li>
                  ))}
                </ul>
              </>
            )}
          </section>
          <section id="confirmacao" className="secao">
            <h2>Confirmação</h2>
            <form className="form-busca" onSubmit={buscar} autoComplete="off">
              <label htmlFor="primeiro-nome">Digite seu primeiro nome</label>
              <input id="primeiro-nome" type="text" maxLength={40} required
                value={termo} onChange={(e) => setTermo(e.target.value)} />
              <button type="submit" className="botao">Buscar</button>
            </form>

            <div className="resultados" aria-live="polite">
              {familiasEncontradas.map((f) => (
                <ul key={f.id} className="familia">
                  {f.membros.map((m) => {
                    const nome = nomeDe(m);
                    const chave = `${f.id}:${nome}`;
                    const ativo = Boolean(confirmados[chave]);
                    return (
                      <li key={chave}>
                        <span>{nome}</span>
                        <button type="button" className="botao" aria-pressed={ativo}
                          onClick={() => alternar(chave, nome, f.membros.map(nomeDe).join(", "))}>
                          {ativo ? "Confirmado ✓" : "Confirmar presença"}
                        </button>
                      </li>
                    );
                  })}
                </ul>
              ))}
            </div>

            <p className="mensagem" role="status">{mensagemTexto}</p>
          </section>

          <section id="duvidas" className="secao faq">
            <h2>Dúvidas frequentes</h2>
            {FAQ.map((item) => (
              <details key={item.pergunta}>
                <summary>{item.pergunta}</summary>
                <p>{item.resposta}</p>
              </details>
            ))}
          </section>
        </main>

        <footer><p>Com amor, Bruno &amp; Márcia</p></footer>
      </>
    );
  }

  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
